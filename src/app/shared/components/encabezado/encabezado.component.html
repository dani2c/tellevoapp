<ion-header>
  <ion-toolbar color="primary">
    <!-- Botón de volver atrás -->
    <ion-buttons slot="start">
      <ion-button *ngIf="mostrarBotonVolver" (click)="volverAtras()">
        <ion-icon 
          name="arrow-back-outline" 
          class="icon-large" 
          style="color: white;">
        </ion-icon>
      </ion-button>
    </ion-buttons>

    <!-- Título centrado -->
    <div class="titulo-container">
      <h1>Te Llevo App</h1>
    </div>

    <!-- Botones de perfil y cerrar sesión -->
    <ion-buttons slot="end">
      <ion-button (click)="goToPerfil()">
        <ion-icon 
          name="person-circle-outline" 
          class="icon-large" 
          style="color: white;">
        </ion-icon>
      </ion-button>
      <ion-button (click)="cerrarSesion()">
        <ion-icon 
          name="log-out-outline" 
          class="icon-large" 
          style="color: white;">
        </ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
