<app-encabezado2 [mostrarBotonVolver]="true"></app-encabezado2>

<ion-content class="fondo">
  <ion-text color="secondary" class="ion-text-center">
    <ion-list color="primary" class="lista">
      <ion-title style="color: #fdb820; text-align:center;">Registro</ion-title>
      <form #registroForm="ngForm" (ngSubmit)="registro()">
        <ion-item>
          <ion-input
            required
            label="Correo"
            labelPlacement="floating"
            placeholder="ejemplo@duocuc.cl"
            name="email"
            type="email"
            [(ngModel)]="email">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            required
            label="Clave"
            labelPlacement="floating"
            placeholder="*********"
            name="password"
            type="password"
            [(ngModel)]="password">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            required
            label="Nombre"
            labelPlacement="floating"
            placeholder="Pablo"
            name="nombre"
            type="text"
            [(ngModel)]="nombre">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            required
            label="Apellido"
            labelPlacement="floating"
            placeholder="Sepulveda"
            name="apellido"
            type="text"
            [(ngModel)]="apellido">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            required
            label="Teléfono"
            labelPlacement="floating"
            placeholder="123456789"
            name="telefono"
            type="tel"
            [(ngModel)]="telefono">
          </ion-input>
        </ion-item>

        <ion-button class="botonreg" expand="block" fill="solid" style="--background: #2a9d65; color: white;" type="submit" [disabled]="registroForm.invalid">
          Registrarse
        </ion-button>
      </form>
    </ion-list>
  </ion-text>
</ion-content>
