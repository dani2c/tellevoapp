<app-encabezado [mostrarBotonVolver]="true"></app-encabezado>

<ion-content class="fondo">
  <div class="historial-container">
    <ion-header>
      <ion-toolbar>
        <ion-title>Historial</ion-title>
      </ion-toolbar>
    </ion-header>
    <div *ngIf="!(solicitudes$ | async)?.length" class="empty-message">
      <h3>No hay solicitudes para mostrar.</h3>
    </div>
    <ion-list *ngIf="(solicitudes$ | async)?.length">
      <div *ngFor="let solicitud of solicitudes$ | async" class="solicitud-card">
        <h2>{{ solicitud.nombrePasajero }} {{ solicitud.apellidoPasajero }}</h2>
        <p><strong>Teléfono:</strong> {{ solicitud.telefono }}</p>
        <p><strong>Ubicación:</strong> {{ solicitud.ubicacion || 'Sin ubicación disponible' }}</p>
      </div>
    </ion-list>
  </div>
</ion-content>
