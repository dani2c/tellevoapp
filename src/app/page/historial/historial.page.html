<ion-content>
  <ion-list>
    <ion-item *ngFor="let solicitud of solicitudes$ | async">
      <ion-label>
        <h2>Pasajero: {{ solicitud.nombrePasajero }} {{ solicitud.apellidoPasajero }}</h2>
        <p>Teléfono: {{ solicitud.telefono }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
