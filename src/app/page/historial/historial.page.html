<app-encabezado></app-encabezado>
<ion-content class="fondo">
  <ion-list>
    <ion-item *ngFor="let solicitud of solicitudes$ | async">
      <ion-label>
        <h2>Pasajero: {{ solicitud.nombrePasajero }} {{ solicitud.apellidoPasajero }}</h2>
        <p>Teléfono: {{ solicitud.telefono }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
  <ion-button 
  (click)="goToHome()" 
  style="color: white;" 
  class="footer">
  Volver atrás
</ion-button>
</ion-content>
