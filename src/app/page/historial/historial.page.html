<ion-header>
  <ion-toolbar>
    <ion-title>Historial</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let solicitud of solicitudes$ | async">
      <ion-label>
        <h2>Pasajero: {{ solicitud.nombrePasajero }} {{ solicitud.apellidoPasajero }}</h2>
        <p>Teléfono: {{ solicitud.telefono }}</p>
      </ion-label>
    </ion-item>

    <ion-item *ngIf="!(solicitudes$ | async)?.length">
      <ion-label>
        <h3>No hay solicitudes para mostrar.</h3>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
