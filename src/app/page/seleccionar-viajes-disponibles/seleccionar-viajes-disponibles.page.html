<app-encabezado [mostrarBotonVolver]="true"></app-encabezado>

<ion-content class="fondo">
  <div id="map" style="height: 400px;"></div>

  <ion-list>
    <ion-item *ngFor="let destino of destinos$ | async">
      <ion-label>
        <h2>Usuario: {{ destino.nombre }} {{ destino.apellido }}</h2>
        <p>Destino: {{ destino.direccion || 'Cargando dirección...' }}</p>
      </ion-label>

      <ion-button *ngIf="usuarioActivo?.uid === destino.uid" color="danger" (click)="eliminarDestino(destino.id)">
        <ion-icon name="trash"></ion-icon>
      </ion-button>
      
      <ion-button *ngIf="usuarioActivo?.uid !== destino.uid"
            color="primary"
            (click)="solicitarViaje(destino.id, destino.uid, destino.nombre, destino.direccion)">
        Pedir
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
