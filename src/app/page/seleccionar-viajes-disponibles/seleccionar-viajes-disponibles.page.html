<app-encabezado></app-encabezado>
<ion-content class="fondo">
  <div id="map" style="height: 400px;"></div>

  <ion-list>
    <ion-item *ngFor="let destino of destinos$ | async">
      <ion-label>
        <h2>Usuario: {{ destino.uid }}</h2>
        <p>Destino: Latitud {{ destino.destino.lat }}, Longitud {{ destino.destino.lng }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-button expand="block" color="primary" (click)="goToProgramarViajeConAuto()">
    Programar un nuevo viaje
  </ion-button>
</ion-content>
