<ion-content>
  <div id="map" style="height: 400px;"></div>

  <ion-list>
    <ion-item *ngFor="let viaje of viajesDisponibles">
      <ion-label>
        <h2>Chofer: {{ viaje.nombre }} {{ viaje.apellido }}</h2>
        <p>Destino: Latitud {{ viaje.destino?.lat }}, Longitud {{ viaje.destino?.lng }}</p>
      </ion-label>
      
      <!-- Botón de eliminación solo visible para el propietario del viaje -->
      <ion-button *ngIf="usuarioActivo && viaje.username === usuarioActivo.username" 
                  color="danger" 
                  (click)="eliminarViaje(viaje.id)">
        <ion-icon name="trash"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
