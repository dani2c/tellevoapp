<app-encabezado></app-encabezado>
<ion-content class="fondo">

  <div id="map" style="height: 300px;"></div>
  
  <div *ngFor="let viaje of viajesDisponibles" class="foto-auto">
    <ion-button fill="clear" (click)="verDetalleChofer(viaje)">
      <img class="borde" [src]="viaje.imagen || 'assets/images/persona-placeholder.jpg'" alt="Usuario" />
    </ion-button>
    <p style="color: black;">{{ viaje.nombre }} {{ viaje.apellido }}</p>
    <p style="color: black;">Capacidad: {{ viaje.capacidad }}</p>
    <ion-button *ngIf="viaje.capacidadDisponible > 0" class="boton" style="--background: #2a9d65; color: white;">
      Disponible!
    </ion-button>
    <ion-button *ngIf="viaje.capacidadDisponible === 0" class="boton" color="danger">
      AGOTADO
    </ion-button>
  </div>  

          <ion-button (click)="goToProgramarViajeConAuto()" style="color:white;" class="footer">Volver atrás</ion-button>

</ion-content>
