<app-encabezado></app-encabezado>

<ion-content class="fondo">
  <form>
    <ion-toolbar class="toolbar">
      <ion-title>Elija su destino</ion-title>
    </ion-toolbar>

    <!-- Mapa de Google Maps -->
    <div id="map" style="height: 300px; width: 100%;"></div>

    <ion-button 
      class="botoniniciarsesion" 
      expand="full" 
      type="button" 
      (click)="confirmarDestino()" 
      style="--background: #2a9d65; color: white;">
      Confirmar viaje
    </ion-button>
    <ion-button 
      (click)="goToPidiendoAuto()" 
      style="color: white;" 
      class="footer">
      Volver atrás
    </ion-button>
  </form>
</ion-content>
